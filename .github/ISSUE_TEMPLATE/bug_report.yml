name: Engineering defect
about: Report a reproducible ARVREL defect using synthetic or contributor-owned evidence
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach customer captures, proprietary SCL files, credentials, station names, or employer-confidential data. Use the private security-advisory workflow for vulnerabilities.

        For feeder closed-loop defects, include the timing rail / run identity and state whether BO1→BI1 was connected. For Transformer Differential IED defects, run the built-in 10-scenario self-test first and paste its copied evidence below. A deterministic self-test failure should be reported before changing transformer settings.
  - type: input
    id: version
    attributes:
      label: ARVREL version or commit
      placeholder: v0.1.0-beta.6 / commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows and display environment
      placeholder: Windows 11 24H2 x64, 125% scaling, 1600x900
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source / workflow mode
      options:
        - Feeder closed-loop internal injection
        - Transformer deterministic self-test
        - Transformer two-sided internal injection
        - AVR / OLTC internal plant
        - IEC 61850 MMS server / control
        - Live Npcap Sampled Values
        - PCAP/PCAPNG replay
        - Settings or SCL import
        - Evidence export
        - Release/install/update
    validations:
      required: true
  - type: textarea
    id: closed_loop
    attributes:
      label: Feeder closed-loop timing / wiring evidence
      description: For feeder closed-loop issues, include T0, RELAY ANY PU, TESTSET BI2 ACCEPT, operated-element pickup/P→T, relay trip request, TESTSET BI1 ACCEPT, OUTPUT state, reset/re-arm state, and whether BO1→BI1 was connected. For unrelated issues, enter Not applicable.
      placeholder: Run ID..., BO1→BI1 connected, TESTSET BI1 75.750 ms, OUTPUT OFF · FROZEN CAPTURE, READY TO RE-ARM...
    validations:
      required: true
  - type: textarea
    id: transformer_self_test
    attributes:
      label: Transformer self-test evidence
      description: For Transformer IED issues, use COPY EVIDENCE after RUN 10-SCENARIO SELF-TEST and paste the complete sanitized report here. For unrelated issues, enter Not applicable.
      placeholder: PASS · 10/10 · transformer-public-beta-v1, or paste the failed scenario evidence
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include synthetic APPID/VLAN/svID/sample-rate details when relevant. For transformer Live/Replay issues, identify HV/LV stream roles without exposing restricted station data. For MMS issues, identify the logical node/data/control object and modeled authority state.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic evidence and logs
      description: Paste sanitized event trace, trust state, timing evidence, transformer security state, MMS control audit, crash-log excerpt, test fixture, or screenshot. Never upload restricted process-bus captures merely to reproduce a software issue.
  - type: checkboxes
    id: boundary
    attributes:
      label: Data and safety confirmation
      options:
        - label: I removed customer, employer, station, credential, and other restricted information.
          required: true
        - label: This report does not request operational trip, OLTC motor, or switching authority from ARVREL.
          required: true
