name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout ARVREL
        uses: actions/checkout@v4
        with:
          path: arvrel

      - name: Checkout sibling ARIEC61850
        uses: actions/checkout@v4
        with:
          repository: masarray/ARIEC61850
          path: ARIEC61850

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        working-directory: arvrel
        run: dotnet restore .\ARVREL.sln

      - name: Build
        working-directory: arvrel
        run: dotnet build .\ARVREL.sln -c Release --no-restore

      - name: Test
        working-directory: arvrel
        run: dotnet test .\ARVREL.sln -c Release --no-build --logger "trx;LogFileName=arvrel-tests.trx"

      - name: Audit vulnerable NuGet dependencies
        shell: pwsh
        working-directory: arvrel
        run: |
          $ErrorActionPreference = 'Stop'
          $output = dotnet list .\ARVREL.sln package --vulnerable --include-transitive
          $text = $output | Out-String
          $text | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet vulnerability audit failed with exit code $LASTEXITCODE."
          }
          if ($text -match 'has the following vulnerable packages') {
            throw 'The dependency audit reported one or more vulnerable packages.'
          }

      - name: Install Inno Setup for release-candidate packaging
        if: startsWith(github.head_ref, 'release/')
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE."
          }

      - name: Package release candidate
        if: startsWith(github.head_ref, 'release/')
        shell: pwsh
        working-directory: arvrel
        run: .\scripts\package-release.ps1 -SkipSbom

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvrel-test-results
          path: arvrel/**/TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload release candidate
        if: startsWith(github.head_ref, 'release/')
        uses: actions/upload-artifact@v4
        with:
          name: arvrel-release-candidate
          path: arvrel/artifacts/release/*
          if-no-files-found: error
          retention-days: 14
