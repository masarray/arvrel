name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout ARVREL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: arvrel
          persist-credentials: false

      - name: Checkout pinned ARIEC61850
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: masarray/ARIEC61850
          ref: c1afc68c9931e857eb787b0f249db2c2b0b757c4
          path: ARIEC61850
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        working-directory: arvrel
        run: dotnet restore .\ARVREL.sln

      - name: Build
        working-directory: arvrel
        run: dotnet build .\ARVREL.sln -c Release --no-restore

      - name: Test
        working-directory: arvrel
        run: dotnet test .\ARVREL.sln -c Release --no-build --logger "trx;LogFileName=arvrel-tests.trx"

      - name: Audit vulnerable NuGet dependencies
        shell: pwsh
        working-directory: arvrel
        run: |
          $ErrorActionPreference = 'Stop'
          $output = dotnet list .\ARVREL.sln package --vulnerable --include-transitive
          $text = $output | Out-String
          $text | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet vulnerability audit failed with exit code $LASTEXITCODE."
          }
          if ($text -match 'has the following vulnerable packages') {
            throw 'The dependency audit reported one or more vulnerable packages.'
          }

      - name: Install Inno Setup for release-candidate packaging
        if: startsWith(github.head_ref, 'release/')
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE."
          }

      - name: Package release candidate
        if: startsWith(github.head_ref, 'release/')
        shell: pwsh
        working-directory: arvrel
        run: .\scripts\package-release.ps1 -SkipSbom

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arvrel-test-results
          path: arvrel/**/TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload release candidate
        if: startsWith(github.head_ref, 'release/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arvrel-release-candidate
          path: arvrel/artifacts/release/*
          if-no-files-found: error
          retention-days: 14
