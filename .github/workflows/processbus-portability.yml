name: Process-bus portability

on:
  pull_request:
    paths:
      - "src/Arvrel.Capture/**"
      - "src/Arvrel.ProcessBus/**"
      - "src/Arvrel.Protection/**"
      - ".github/workflows/processbus-portability.yml"
  push:
    branches: [main]
    paths:
      - "src/Arvrel.Capture/**"
      - "src/Arvrel.ProcessBus/**"
      - "src/Arvrel.Protection/**"
      - ".github/workflows/processbus-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  processbus-portability:
    name: processbus-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout ARVREL
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: arvrel
          persist-credentials: false

      - name: Checkout pinned ARIEC61850 decoder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: masarray/ARIEC61850
          ref: c1afc68c9931e857eb787b0f249db2c2b0b757c4
          path: ARIEC61850
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Build portable capability stub without decoder
        shell: bash
        working-directory: arvrel
        run: >-
          dotnet build src/Arvrel.ProcessBus/Arvrel.ProcessBus.csproj
          --configuration Release
          --framework net8.0
          -p:HasARIEC61850Sibling=false

      - name: Build portable process-bus decoder and replay core
        shell: bash
        working-directory: arvrel
        run: >-
          dotnet build src/Arvrel.ProcessBus/Arvrel.ProcessBus.csproj
          --configuration Release
          --framework net8.0
          -p:HasARIEC61850Sibling=true
          -p:ARIEC61850Root="${{ github.workspace }}/ARIEC61850"
