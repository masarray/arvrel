name: Apply P1 source

on:
  push:
    branches:
      - feature/p1-process-bus-lucide
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[p1-source-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/p1-process-bus-lucide
          fetch-depth: 0

      - name: Reconstruct and apply P1 source
        shell: bash
        run: |
          set -euo pipefail
          cat .p1-source/chunk-02-p00 .p1-source/chunk-02-p01 .p1-source/chunk-02-p02 \
              .p1-source/chunk-02-p03 .p1-source/chunk-02-p04 .p1-source/chunk-02-p05 > /tmp/chunk-02
          echo "2d0c2169cc3e678221f40c9019d042db57c427b88dc7f4bac5cf3995e6e75bad  /tmp/chunk-02" | sha256sum --check
          cat .p1-source/chunk-00 .p1-source/chunk-01 /tmp/chunk-02 \
              .p1-source/chunk-03 .p1-source/chunk-04 > /tmp/p1-source.b64
          echo "8eaa17f0a34ceb9fddbcc6412aba46640b916bafe4717e08e5c8cab9ff8c227c  /tmp/p1-source.b64" | sha256sum --check
          base64 --decode /tmp/p1-source.b64 > /tmp/p1-source.tar.gz
          echo "679438b5e9f9a31dfe149d029c7fbb83477d459c87254d153661190c5d613a08  /tmp/p1-source.tar.gz" | sha256sum --check
          tar -xzf /tmp/p1-source.tar.gz -C .
          rm -rf .p1-source .github/workflows/apply-p1-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add P1 process-bus pipeline and Lucide icon system [p1-source-applied]"
          git push origin HEAD:feature/p1-process-bus-lucide
