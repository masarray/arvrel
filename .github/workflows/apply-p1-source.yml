name: Apply P1 source

on:
  push:
    branches:
      - feature/p1-process-bus-lucide

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p1-source-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply P1 source
        shell: bash
        run: |
          set -euo pipefail
          cat .p1-source/chunk-00 .p1-source/chunk-01 > /tmp/p1-source.b64
          head -c 12000 .p1-source/chunk-02 >> /tmp/p1-source.b64
          cat .p1-source/chunk-03 .p1-source/chunk-04 >> /tmp/p1-source.b64
          base64 --decode /tmp/p1-source.b64 > /tmp/p1-source.tar.gz
          tar -xzf /tmp/p1-source.tar.gz -C .
          rm -rf .p1-source .github/workflows/apply-p1-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add P1 process-bus pipeline and Lucide icon system [p1-source-applied]"
          git push origin HEAD:feature/p1-process-bus-lucide
