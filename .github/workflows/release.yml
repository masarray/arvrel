name: Desktop release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - VERSION
      - RELEASE-NOTES.md
      - ARVREL.sln
      - "Directory.Build.*"
      - "src/**"
      - "tests/**"
      - "installer/**"
      - "scripts/package-release.ps1"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - VERSION
      - RELEASE-NOTES.md
      - ARVREL.sln
      - "Directory.Build.*"
      - "src/**"
      - "tests/**"
      - "installer/**"
      - "scripts/package-release.ps1"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvrel-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-portability:
    name: protection-core-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout ARVREL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Test cross-platform protection core
        shell: bash
        run: >-
          dotnet test tests/Arvrel.Protection.Tests/Arvrel.Protection.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=protection-core-${{ runner.os }}.trx"

  build:
    name: build-windows-packages
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      required: ${{ steps.release_gate.outputs.required }}
      release_exists: ${{ steps.release_gate.outputs.release_exists }}
      publish_allowed: ${{ steps.release_gate.outputs.publish_allowed }}
      tag: ${{ steps.release_gate.outputs.tag }}
      version: ${{ steps.release_gate.outputs.version }}

    steps:
      - name: Checkout ARVREL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: arvrel
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned ARIEC61850 engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: masarray/ARIEC61850
          ref: 0d0aa4e31c17f9e5a10901ad52fa75e9c4581daf
          path: ARIEC61850
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Resolve version and release completeness
        id: release_gate
        shell: pwsh
        working-directory: arvrel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid VERSION value: $version"
          }

          $tag = "v$version"
          $eventName = $env:GITHUB_EVENT_NAME
          $isPullRequest = $eventName -eq 'pull_request'
          $isTag = $env:GITHUB_REF -like 'refs/tags/*'
          if ($isTag -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Pushed tag '$env:GITHUB_REF_NAME' does not match VERSION-derived tag '$tag'."
          }

          $installer = "ARVREL-Setup-v$version-win-x64.exe"
          $portableExe = "ARVREL-v$version-win-x64-portable.exe"
          $portableZip = "ARVREL-v$version-win-x64-portable.zip"
          $notices = "ARVREL-v$version-legal-notices.zip"
          $requiredAssetNames = @($installer, $portableExe, $portableZip, $notices, 'SHA256SUMS.txt')

          $releaseText = (& gh release view $tag --json tagName,isDraft,isPrerelease,assets 2>$null | Out-String).Trim()
          $releaseExists = $LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($releaseText)
          $complete = $false
          if ($releaseExists) {
            $release = $releaseText | ConvertFrom-Json
            $assetNames = @($release.assets | ForEach-Object name)
            $missing = @($requiredAssetNames | Where-Object { $_ -notin $assetNames })
            $complete = $missing.Count -eq 0 -and -not $release.isDraft
            if (-not $complete) {
              Write-Warning "Release $tag exists but does not yet contain the new complete package set. Missing: $($missing -join ', ')"
            }
          }

          $tagExists = -not [string]::IsNullOrWhiteSpace((git ls-remote --tags origin "refs/tags/$tag" | Out-String))
          $tagMatchesCurrentCommit = $false
          if ($tagExists) {
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}" --force
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch existing tag $tag."
            }
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            $tagMatchesCurrentCommit = $tagCommit -eq $env:GITHUB_SHA
          }

          $required = $isPullRequest -or -not $complete
          $publishAllowed = -not $isPullRequest -and (
            $env:GITHUB_REF -eq 'refs/heads/main' -or $isTag
          )

          if ($publishAllowed -and $tagExists -and -not $tagMatchesCurrentCommit -and -not $complete) {
            Write-Warning "Tag $tag already belongs to an older commit. This run will validate packages but will not repair that historical release. Bump VERSION for the next publishable release."
            $publishAllowed = $false
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "required=$($required.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_exists=$($releaseExists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish_allowed=$($publishAllowed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version $version · tag $tag · validation required: $required · publication allowed: $publishAllowed"

      - name: Restore
        if: steps.release_gate.outputs.required == 'true'
        shell: pwsh
        working-directory: arvrel
        run: dotnet restore ARVREL.sln

      - name: Build
        if: steps.release_gate.outputs.required == 'true'
        shell: pwsh
        working-directory: arvrel
        run: dotnet build ARVREL.sln --configuration Release --no-restore

      - name: Test
        if: steps.release_gate.outputs.required == 'true'
        shell: pwsh
        working-directory: arvrel
        run: dotnet test ARVREL.sln --configuration Release --no-build --logger "trx;LogFileName=release-tests.trx"

      - name: Audit vulnerable NuGet dependencies
        if: steps.release_gate.outputs.required == 'true'
        shell: pwsh
        working-directory: arvrel
        run: |
          $ErrorActionPreference = 'Stop'
          $output = dotnet list ARVREL.sln package --vulnerable --include-transitive
          $text = $output | Out-String
          $text | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet vulnerability audit failed with exit code $LASTEXITCODE."
          }
          if ($text -match 'has the following vulnerable packages') {
            throw 'The dependency audit reported one or more vulnerable packages. Release publication is blocked.'
          }

      - name: Install release tooling
        if: steps.release_gate.outputs.required == 'true'
        id: tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE."
          }

          $sbomAvailable = $true
          dotnet tool install --global CycloneDX
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'CycloneDX tool installation failed; the release will retain the NuGet dependency report.'
            $sbomAvailable = $false
          }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "sbom_available=$($sbomAvailable.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build installer and portable packages
        if: steps.release_gate.outputs.required == 'true'
        shell: pwsh
        working-directory: arvrel
        run: |
          $skipSbom = '${{ steps.tooling.outputs.sbom_available }}' -ne 'true'
          .\scripts\package-release.ps1 `
            -Version '${{ steps.release_gate.outputs.version }}' `
            -SkipSbom:$skipSbom

      - name: Validate no-admin and single-file contract
        if: steps.release_gate.outputs.required == 'true'
        shell: pwsh
        working-directory: arvrel
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.release_gate.outputs.version }}'
          $portablePath = "artifacts\release\ARVREL-v$version-win-x64-portable.exe"
          $installerPath = "artifacts\release\ARVREL-Setup-v$version-win-x64.exe"

          foreach ($path in @($portablePath, $installerPath)) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required executable was not produced: $path"
            }
            if ((Get-Item $path).Length -lt 1MB) {
              throw "Executable is unexpectedly small: $path"
            }
            $stream = [System.IO.File]::OpenRead((Resolve-Path $path))
            try {
              if ($stream.ReadByte() -ne 0x4D -or $stream.ReadByte() -ne 0x5A) {
                throw "Executable does not have a valid PE header: $path"
              }
            } finally {
              $stream.Dispose()
            }
          }

          $iss = Get-Content installer\ARVREL.iss -Raw
          if ($iss -notmatch '(?m)^PrivilegesRequired=lowest\s*$') {
            throw 'Installer must remain a per-user, non-elevated installation.'
          }
          if ($iss -match '(?m)^PrivilegesRequiredOverridesAllowed=') {
            throw 'Installer privilege overrides are forbidden for the no-admin package.'
          }
          if ($iss -notmatch '(?m)^DefaultDirName=\{localappdata\}\\Programs\\ARVREL\s*$') {
            throw 'Installer must target the current user LocalAppData Programs directory.'
          }

          $signature = Get-AuthenticodeSignature $portablePath
          Write-Host "Portable Authenticode status: $($signature.Status). No signing secrets are required by this workflow."

      - name: Upload release-candidate artifact
        if: steps.release_gate.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ARVREL-v${{ steps.release_gate.outputs.version }}-release-candidate
          path: arvrel/artifacts/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Existing complete release
        if: steps.release_gate.outputs.required != 'true'
        shell: pwsh
        run: Write-Host 'The VERSION release already exists with all required assets; no duplicate publication was created.'

      - name: Validation-only build
        if: steps.release_gate.outputs.required == 'true' && steps.release_gate.outputs.publish_allowed != 'true'
        shell: pwsh
        run: Write-Host 'Packages were validated and uploaded as a workflow artifact. GitHub Release publication is intentionally disabled for this ref.'

  publish:
    name: attest-publish
    needs: [build, core-portability]
    if: needs.build.outputs.required == 'true' && needs.build.outputs.publish_allowed == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: arvrel
          persist-credentials: false

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ARVREL-v${{ needs.build.outputs.version }}-release-candidate
          path: arvrel/artifacts/release

      - name: Verify release artifact set
        shell: pwsh
        working-directory: arvrel
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.build.outputs.version }}'
          $requiredNames = @(
            "ARVREL-Setup-v$version-win-x64.exe",
            "ARVREL-v$version-win-x64-portable.exe",
            "ARVREL-v$version-win-x64-portable.zip",
            "ARVREL-v$version-legal-notices.zip",
            'SHA256SUMS.txt'
          )
          $producedNames = @(Get-ChildItem artifacts\release -File | ForEach-Object Name)
          $missing = @($requiredNames | Where-Object { $_ -notin $producedNames })
          if ($missing.Count -gt 0) {
            throw "Required release assets are missing from the transferred artifact: $($missing -join ', ')"
          }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: arvrel/artifacts/release/*

      - name: Attest installer and portable packages with SBOM
        if: ${{ hashFiles(format('arvrel/artifacts/release/ARVREL-v{0}-sbom.cdx.json', needs.build.outputs.version)) != '' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            arvrel/artifacts/release/ARVREL-Setup-v${{ needs.build.outputs.version }}-win-x64.exe
            arvrel/artifacts/release/ARVREL-v${{ needs.build.outputs.version }}-win-x64-portable.exe
            arvrel/artifacts/release/ARVREL-v${{ needs.build.outputs.version }}-win-x64-portable.zip
          sbom-path: arvrel/artifacts/release/ARVREL-v${{ needs.build.outputs.version }}-sbom.cdx.json

      - name: Publish or repair GitHub prerelease
        shell: pwsh
        working-directory: arvrel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.build.outputs.version }}'
          $tag = '${{ needs.build.outputs.tag }}'
          $assets = @(Get-ChildItem artifacts\release -File | Sort-Object Name | ForEach-Object FullName)
          $requiredNames = @(
            "ARVREL-Setup-v$version-win-x64.exe",
            "ARVREL-v$version-win-x64-portable.exe",
            "ARVREL-v$version-win-x64-portable.zip",
            "ARVREL-v$version-legal-notices.zip",
            'SHA256SUMS.txt'
          )

          if ('${{ needs.build.outputs.release_exists }}' -eq 'true') {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub release asset repair failed with exit code $LASTEXITCODE."
            }
            gh release edit $tag `
              --title "ARVREL $tag" `
              --notes-file RELEASE-NOTES.md `
              --prerelease
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub release metadata repair failed with exit code $LASTEXITCODE."
            }
          } else {
            gh release create $tag @assets `
              --target $env:GITHUB_SHA `
              --title "ARVREL $tag" `
              --notes-file RELEASE-NOTES.md `
              --prerelease
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed with exit code $LASTEXITCODE."
            }
          }

          $verifiedText = (& gh release view $tag --json isDraft,isPrerelease,assets | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($verifiedText)) {
            throw "Unable to verify published release $tag."
          }
          $verified = $verifiedText | ConvertFrom-Json
          $verifiedNames = @($verified.assets | ForEach-Object name)
          $missingPublished = @($requiredNames | Where-Object { $_ -notin $verifiedNames })
          if ($verified.isDraft -or -not $verified.isPrerelease -or $missingPublished.Count -gt 0) {
            throw "Published release verification failed. Missing assets: $($missingPublished -join ', ')"
          }
          Write-Host "Verified prerelease $tag with per-user installer, single-file portable executable, portable archive, checksums and attestations."
