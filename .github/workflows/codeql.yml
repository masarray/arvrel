name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-csharp:
    name: codeql-csharp
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout ARVREL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: arvrel
          persist-credentials: false

      - name: Checkout pinned ARIEC61850
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: masarray/ARIEC61850
          ref: 0d0aa4e31c17f9e5a10901ad52fa75e9c4581daf
          path: ARIEC61850
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        working-directory: arvrel
        run: dotnet restore .\ARVREL.sln

      - name: Build
        working-directory: arvrel
        run: dotnet build .\ARVREL.sln -c Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:csharp