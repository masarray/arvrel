name: Avalonia shell portability

on:
  pull_request:
    paths:
      - "desktop/**"
      - "src/Arvrel.Desktop/**"
      - "src/Arvrel.Application/**"
      - "src/Arvrel.Capture/**"
      - "src/Arvrel.ProcessBus/**"
      - "src/Arvrel.Protection/**"
      - "tests/Arvrel.Desktop.Tests/**"
      - ".github/workflows/avalonia-shell.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/Arvrel.Desktop/**"
      - "src/Arvrel.Application/**"
      - "src/Arvrel.Capture/**"
      - "src/Arvrel.ProcessBus/**"
      - "src/Arvrel.Protection/**"
      - "tests/Arvrel.Desktop.Tests/**"
      - ".github/workflows/avalonia-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avalonia-shell:
    name: shell-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: Arvrel.Desktop
          - os: macos-latest
            rid: osx-arm64
            executable: Arvrel.Desktop
          - os: windows-latest
            rid: win-x64
            executable: Arvrel.Desktop.exe

    steps:
      - name: Checkout ARVREL
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: arvrel
          persist-credentials: false

      - name: Checkout pinned ARIEC61850 decoder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: masarray/ARIEC61850
          ref: c1afc68c9931e857eb787b0f249db2c2b0b757c4
          path: ARIEC61850
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Build decoder-less desktop solution
        shell: bash
        working-directory: arvrel/desktop
        run: >-
          dotnet build ARVREL.Desktop.sln
          --configuration Release
          -p:HasARIEC61850Sibling=false

      - name: Test shell lifecycle without display server
        shell: bash
        working-directory: arvrel/desktop
        run: >-
          dotnet test ../tests/Arvrel.Desktop.Tests/Arvrel.Desktop.Tests.csproj
          --configuration Release
          --no-build
          -p:HasARIEC61850Sibling=false

      - name: Publish shell with pinned portable decoder
        shell: bash
        working-directory: arvrel/desktop
        run: >-
          dotnet publish ../src/Arvrel.Desktop/Arvrel.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained false
          --output ../artifacts/${{ matrix.rid }}
          -p:HasARIEC61850Sibling=true
          -p:ARIEC61850Root="${{ github.workspace }}/ARIEC61850"

      - name: Validate desktop host output
        shell: bash
        working-directory: arvrel/desktop
        run: |
          test -f "../artifacts/${{ matrix.rid }}/Arvrel.Desktop.dll"
          test -f "../artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
