name: Avalonia desktop packages

on:
  pull_request:
    paths:
      - VERSION
      - RELEASE-NOTES.md
      - "desktop/**"
      - "src/Arvrel.Desktop/**"
      - "src/Arvrel.Application/**"
      - "src/Arvrel.Capture/**"
      - "src/Arvrel.ProcessBus/**"
      - "src/Arvrel.Protection/**"
      - "packaging/avalonia/**"
      - "scripts/package-avalonia-*"
      - ".github/workflows/avalonia-packaging.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - VERSION
      - RELEASE-NOTES.md
      - "desktop/**"
      - "src/Arvrel.Desktop/**"
      - "src/Arvrel.Application/**"
      - "src/Arvrel.Capture/**"
      - "src/Arvrel.ProcessBus/**"
      - "src/Arvrel.Protection/**"
      - "packaging/avalonia/**"
      - "scripts/package-avalonia-*"
      - ".github/workflows/avalonia-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvrel-avalonia-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  ARIEC61850_REF: c1afc68c9931e857eb787b0f249db2c2b0b757c4

jobs:
  prepare:
    name: resolve-package-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout ARVREL
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION value: $version" >&2
            exit 1
          fi
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Pushed tag '$GITHUB_REF_NAME' does not match VERSION-derived tag '$tag'." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    name: package-win-x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout ARVREL
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: arvrel
          persist-credentials: false

      - name: Checkout pinned ARIEC61850 decoder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: masarray/ARIEC61850
          ref: ${{ env.ARIEC61850_REF }}
          path: ARIEC61850
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows host
        shell: pwsh
        working-directory: arvrel/desktop
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish ../src/Arvrel.Desktop/Arvrel.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output ../artifacts/publish/win-x64 `
            -p:Version='${{ needs.prepare.outputs.version }}' `
            -p:HasARIEC61850Sibling=true `
            -p:ARIEC61850Root='${{ github.workspace }}\ARIEC61850' `
            -p:DebugSymbols=false `
            -p:DebugType=None
          if ($LASTEXITCODE -ne 0) {
            throw "Windows self-contained publish failed with exit code $LASTEXITCODE."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE."
          }

      - name: Build Windows packages
        shell: pwsh
        working-directory: arvrel
        run: |
          .\scripts\package-avalonia-windows.ps1 `
            -Version '${{ needs.prepare.outputs.version }}' `
            -PublishDirectory 'artifacts\publish\win-x64' `
            -OutputDirectory 'artifacts\packages\win-x64' `
            -CommitSha '${{ github.sha }}'

      - name: Upload Windows packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-win-x64
          path: arvrel/artifacts/packages/win-x64/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: package-linux-x64
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout ARVREL
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: arvrel
          persist-credentials: false

      - name: Checkout pinned ARIEC61850 decoder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: masarray/ARIEC61850
          ref: ${{ env.ARIEC61850_REF }}
          path: ARIEC61850
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Linux host
        shell: bash
        working-directory: arvrel/desktop
        run: |
          set -euo pipefail
          dotnet publish ../src/Arvrel.Desktop/Arvrel.Desktop.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output ../artifacts/publish/linux-x64 \
            -p:Version='${{ needs.prepare.outputs.version }}' \
            -p:HasARIEC61850Sibling=true \
            -p:ARIEC61850Root='${{ github.workspace }}/ARIEC61850' \
            -p:DebugSymbols=false \
            -p:DebugType=None

      - name: Build Linux packages
        shell: bash
        working-directory: arvrel
        run: |
          set -euo pipefail
          bash ./scripts/package-avalonia-linux.sh \
            '${{ needs.prepare.outputs.version }}' \
            'artifacts/publish/linux-x64' \
            'artifacts/packages/linux-x64' \
            '${{ github.sha }}'

      - name: Upload Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-linux-x64
          path: arvrel/artifacts/packages/linux-x64/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: package-osx-arm64
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout ARVREL
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: arvrel
          persist-credentials: false

      - name: Checkout pinned ARIEC61850 decoder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: masarray/ARIEC61850
          ref: ${{ env.ARIEC61850_REF }}
          path: ARIEC61850
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained macOS host
        shell: bash
        working-directory: arvrel/desktop
        run: |
          set -euo pipefail
          dotnet publish ../src/Arvrel.Desktop/Arvrel.Desktop.csproj \
            --configuration Release \
            --runtime osx-arm64 \
            --self-contained true \
            --output ../artifacts/publish/osx-arm64 \
            -p:Version='${{ needs.prepare.outputs.version }}' \
            -p:HasARIEC61850Sibling=true \
            -p:ARIEC61850Root='${{ github.workspace }}/ARIEC61850' \
            -p:DebugSymbols=false \
            -p:DebugType=None

      - name: Build macOS packages
        shell: bash
        working-directory: arvrel
        run: |
          set -euo pipefail
          bash ./scripts/package-avalonia-macos.sh \
            '${{ needs.prepare.outputs.version }}' \
            'artifacts/publish/osx-arm64' \
            'artifacts/packages/osx-arm64' \
            '${{ github.sha }}'

      - name: Upload macOS packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-osx-arm64
          path: arvrel/artifacts/packages/osx-arm64/*
          if-no-files-found: error
          retention-days: 30

  verify:
    name: verify-package-set
    needs: [prepare, windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-*
          path: packages
          merge-multiple: true

      - name: Verify checksums and expected package set
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          expected=(
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-win-x64-portable.zip"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-win-x64-setup.exe"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-linux-x64.tar.gz"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-linux-x64.deb"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-osx-arm64.app.zip"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-osx-arm64.dmg"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-win-x64-manifest.json"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-linux-x64-manifest.json"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-osx-arm64-manifest.json"
            "SHA256SUMS-win-x64.txt"
            "SHA256SUMS-linux-x64.txt"
            "SHA256SUMS-osx-arm64.txt"
          )
          for file in "${expected[@]}"; do
            test -s "$file" || {
              echo "Missing or empty package artifact: $file" >&2
              exit 1
            }
          done
          sha256sum --check SHA256SUMS-win-x64.txt
          sha256sum --check SHA256SUMS-linux-x64.txt
          sha256sum --check SHA256SUMS-osx-arm64.txt

      - name: Create aggregate index and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          cat > "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-package-index.json" <<JSON
          {
            "schemaVersion": 1,
            "product": "ARVREL Avalonia",
            "version": "${{ needs.prepare.outputs.version }}",
            "commit": "${{ github.sha }}",
            "packages": {
              "windows": [
                "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-win-x64-portable.zip",
                "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-win-x64-setup.exe"
              ],
              "linux": [
                "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-linux-x64.tar.gz",
                "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-linux-x64.deb"
              ],
              "macos": [
                "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-osx-arm64.app.zip",
                "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-osx-arm64.dmg"
              ]
            },
            "signing": {
              "windows": "unsigned",
              "linux": "unsigned",
              "macos": "ad-hoc, not notarized"
            }
          }
          JSON
          sha256sum \
            ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-* \
            > SHA256SUMS-Avalonia.txt

      - name: Upload verified package set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-verified-packages
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: attest-and-publish-tag
    needs: [prepare, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download verified package set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-verified-packages
          path: packages

      - name: Attest cross-platform packages
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: packages/*

      - name: Publish or extend GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.tag }}'
          mapfile -t assets < <(find packages -maxdepth 1 -type f -print | sort)
          if ((${#assets[@]} == 0)); then
            echo "No package assets were downloaded." >&2
            exit 1
          fi

          release_exists=false
          for attempt in {1..30}; do
            if gh release view "$tag" >/dev/null 2>&1; then
              release_exists=true
              break
            fi
            echo "Waiting for the Windows release workflow to create $tag ($attempt/30)..."
            sleep 10
          done

          if [[ "$release_exists" == true ]]; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            if ! gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "ARVREL $tag" \
              --notes-file RELEASE-NOTES.md \
              --prerelease; then
              echo "Release creation raced with another workflow; retrying as an upload."
              gh release upload "$tag" "${assets[@]}" --clobber
            fi
          fi

          published="$(gh release view "$tag" --json assets,isDraft,isPrerelease)"
          for required in \
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-win-x64-portable.zip" \
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-win-x64-setup.exe" \
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-linux-x64.tar.gz" \
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-linux-x64.deb" \
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-osx-arm64.app.zip" \
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-osx-arm64.dmg" \
            "SHA256SUMS-Avalonia.txt"; do
            jq -e --arg name "$required" '.assets | any(.name == $name)' <<<"$published" >/dev/null || {
              echo "Published release is missing $required" >&2
              exit 1
            }
          done
          jq -e '.isDraft == false and .isPrerelease == true' <<<"$published" >/dev/null
