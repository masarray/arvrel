name: Validate and deploy public site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Asset/icon/**"
      - "scripts/prepare-public-site.py"
      - "scripts/validate-public-site.py"
      - "scripts/validate-public-seo.py"
      - "scripts/validate-public-quality.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "Asset/icon/**"
      - "scripts/prepare-public-site.py"
      - "scripts/validate-public-site.py"
      - "scripts/validate-public-seo.py"
      - "scripts/validate-public-quality.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-static-site
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Stage ARVREL brand icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/icon
          cp Asset/icon/favicon.ico docs/assets/icon/
          cp Asset/icon/favicon.svg docs/assets/icon/
          cp Asset/icon/favicon-96x96.png docs/assets/icon/
          cp Asset/icon/apple-touch-icon.png docs/assets/icon/
          cp Asset/icon/web-app-manifest-192x192.png docs/assets/icon/
          cp Asset/icon/web-app-manifest-512x512.png docs/assets/icon/
          cp Asset/icon/site.webmanifest docs/assets/icon/

      - name: Prepare and validate public site
        run: |
          python scripts/prepare-public-site.py
          mv docs/404.html "$RUNNER_TEMP/arvrel-404.html"
          python scripts/validate-public-site.py
          python scripts/validate-public-seo.py
          mv "$RUNNER_TEMP/arvrel-404.html" docs/404.html
          python scripts/validate-public-quality.py

  deploy:
    name: deploy-static-site
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Stage ARVREL brand icons and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/icon
          cp Asset/icon/favicon.ico docs/assets/icon/
          cp Asset/icon/favicon.svg docs/assets/icon/
          cp Asset/icon/favicon-96x96.png docs/assets/icon/
          cp Asset/icon/apple-touch-icon.png docs/assets/icon/
          cp Asset/icon/web-app-manifest-192x192.png docs/assets/icon/
          cp Asset/icon/web-app-manifest-512x512.png docs/assets/icon/
          cp Asset/icon/site.webmanifest docs/assets/icon/
          python scripts/prepare-public-site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload public-site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
