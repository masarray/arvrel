name: Validate and deploy public site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Asset/icon/**"
      - "scripts/validate-public-site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "Asset/icon/**"
      - "scripts/validate-public-site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-static-site
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage ARVREL brand icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/icon
          cp Asset/icon/favicon.ico docs/assets/icon/
          cp Asset/icon/favicon.svg docs/assets/icon/
          cp Asset/icon/favicon-96x96.png docs/assets/icon/
          cp Asset/icon/apple-touch-icon.png docs/assets/icon/
          cp Asset/icon/web-app-manifest-192x192.png docs/assets/icon/
          cp Asset/icon/web-app-manifest-512x512.png docs/assets/icon/
          cp Asset/icon/site.webmanifest docs/assets/icon/

      - name: Validate HTML metadata and local links
        run: python scripts/validate-public-site.py

  deploy:
    name: deploy-static-site
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage ARVREL brand icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/icon
          cp Asset/icon/favicon.ico docs/assets/icon/
          cp Asset/icon/favicon.svg docs/assets/icon/
          cp Asset/icon/favicon-96x96.png docs/assets/icon/
          cp Asset/icon/apple-touch-icon.png docs/assets/icon/
          cp Asset/icon/web-app-manifest-192x192.png docs/assets/icon/
          cp Asset/icon/web-app-manifest-512x512.png docs/assets/icon/
          cp Asset/icon/site.webmanifest docs/assets/icon/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public-site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
